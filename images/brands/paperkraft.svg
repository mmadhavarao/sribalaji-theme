<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
    <!-- ITC subtle top mark -->
    <text x="100" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" letter-spacing="3" fill="#64748b" text-anchor="middle">ITC</text>
    <!-- Paperkraft elegant wordmark -->
    <text x="100" y="31" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" letter-spacing="1.2" fill="#0f172a" text-anchor="middle">Paperkraft</text>
    <!-- Executive accent line -->
    <line x1="55" y1="37" x2="145" y2="37" stroke="#b45309" stroke-width="1.2" stroke-linecap="round"/>
    <text x="100" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="700" letter-spacing="2" fill="#b45309" text-anchor="middle">PREMIUM EXECUTIVE</text>
</svg>
